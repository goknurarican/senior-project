# ─── Reproducibility ─────────────────────────────────────
seed: 42

# ─── Directory structure ─────────────────────────────────
paths:
  raw:       data/raw
  interim:   data/interim
  processed: data/processed
  reports:   data/reports
  logs:      logs

# ─── EEG ─────────────────────────────────────────────────
eeg:
  sfreq: 500          # Hz  (SamplingInterval=2000 µs)
  n_channels: 32      # EEG channels only (35 total – 3 accel)
  n_total_channels: 35

  # 10-20 system channel order (matches BrainVision export)
  channels:
    - Fp1
    - Fz
    - F3
    - F7
    - FT9
    - FC5
    - FC1
    - C3
    - T7
    - TP9
    - CP5
    - CP1
    - Pz
    - P3
    - P7
    - O1
    - Oz
    - O2
    - P4
    - P8
    - TP10
    - CP6
    - CP2
    - Cz
    - C4
    - T8
    - FT10
    - FC6
    - FC2
    - F4
    - F8
    - Fp2

  accelerometer_channels:
    - x_dir
    - y_dir
    - z_dir

  # Filters
  highpass:  1.0   # Hz
  lowpass:  40.0   # Hz
  notch:    50.0   # Hz – Turkish grid frequency

  # ICA
  ica_n_components:   20
  ica_random_state:   42
  ica_max_iter:      800
  ica_method:        fastica

# ─── Epoch windows (seconds) ─────────────────────────────
epochs:
  erp:
    tmin: -0.200   # -200 ms
    tmax:  2.000   # +2000 ms
  causal:
    tmin: -0.500   # -500 ms
    tmax:  3.000   # +3000 ms
  baseline: [-0.200, 0.000]
  reject_threshold_uv: 200   # µV – epoch rejection threshold

# ─── Frequency bands (Hz) ────────────────────────────────
freq_bands:
  delta: [1,  4]
  theta: [4,  8]   # cognitive load ↑ → theta ↑
  alpha: [8, 13]   # relaxation / attention ↓ → alpha ↑
  beta:  [13, 30]  # active thinking / stress → beta ↑
  gamma: [30, 40]  # high-level processing → gamma ↑

# ─── Eye tracking ────────────────────────────────────────
eye:
  sfreq: 62.5             # Hz – Gazepoint GP3 HD
  validity_col: bpogv     # 1=valid gaze, 0=blink/missing
  fpog_col:     fpogv     # fixation POG validity

# ─── Mouse ───────────────────────────────────────────────
mouse:
  mode: event             # event-driven, not fixed-rate

# ─── Scenario marker table ───────────────────────────────
# 16 known UX friction scenario types triggered during experiment
scenario_types:
  - 3ds_soft_fail
  - broken_image
  - button_delay
  - coupon_expired
  - coupon_min_spend
  - facet_reset_once
  - feedback_late
  - first_click_miss
  - network_jitter
  - overlay_blocking
  - payment_retry_timeout
  - price_change
  - search_irrelevant
  - skeleton_prolong
  - slow_image
  - sort_reset

# ─── Subject exclusion criteria (1.5) ────────────────────
# Set once; do NOT change after analysis begins.
exclusion:
  # 1.3: flag if triple (EEG+Eye+Mouse) coverage of EEG window < this
  min_triple_overlap_pct:   90.0
  # 1.5: exclude if EEG–Eye pairwise overlap < this (primary sync check)
  min_eeg_eye_overlap_pct:  95.0
  # 1.5: exclude if BPOGV validity < this
  min_eye_validity_pct:     70.0
  # 1.5: exclude if unique scenario types triggered < this
  min_scenarios_triggered:   9

